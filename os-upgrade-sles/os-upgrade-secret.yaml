# os-upgrade-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: sles-os-upgrade-script
  namespace: cattle-system
type: Opaque
stringData:
  upgrade.sh: |
    #!/bin/bash
    set -e

    echo "Initiating SLES OS Patching sequence..."
    zypper ref

    # Capture the output of the upgrade command
    UPDATE_OUTPUT=$(zypper -n up)
    echo "$UPDATE_OUTPUT"

    # Anti-Loop Guardrail: If nothing was updated, exit successfully immediately.
    if echo "$UPDATE_OUTPUT" | grep -q "Nothing to do"; then
      echo "System is already up to date. No reboot required. OS patching complete."
      exit 0
    fi

    # If we reach this point, packages were actually installed.
    # Check if they were core components that strictly require a reboot.
    if echo "$UPDATE_OUTPUT" | grep -qiE "kernel|systemd|glibc|udev" || [ -f /var/run/reboot-needed ]; then
      echo "Core system updates detected. Executing host reboot via nsenter..."
      nsenter -m -u -i -n -p -t 1 -- reboot
    else
      echo "Minor updates applied. No reboot required. OS patching complete."
    fi