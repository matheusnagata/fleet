# os-upgrade-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: sles-os-upgrade-script
  namespace: cattle-system
type: Opaque
stringData:
  upgrade.sh: |
    #!/bin/bash
    set -e

    echo "Initiating SLES OS Patching sequence..."
    
    # Refresh repositories and apply patches
    zypper ref
    zypper -n patch
    zypper -n up

    # Check for running processes that require a restart after package updates
    SERVICES_NEED_REBOOT=$(zypper ps -sss)
    
    # Evaluate if the kernel was updated or if critical services require a restart
    if [ -f /var/run/reboot-needed ] || [ -n "$SERVICES_NEED_REBOOT" ]; then
      echo "System updates require a reboot. Executing host reboot via nsenter..."
      # Use nsenter to issue the reboot command directly to the host's systemd (PID 1)
      nsenter -m -u -i -n -p -t 1 -- reboot
    else
      echo "No reboot required. OS patching complete."
    fi