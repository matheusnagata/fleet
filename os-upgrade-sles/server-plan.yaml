# server-plan.yaml
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: os-server-plan
  namespace: cattle-system
spec:
  # Upgrade one Control plane node at a time to maintain quorum:
  concurrency: 1
  # Disable the job timeout:
  jobActiveDeadlineSecs: 0
  tolerations:
    - operator: Exists
  nodeSelector:
    matchExpressions:
      - {key: node-role.kubernetes.io/control-plane, operator: In, values: ["true"]}
  serviceAccountName: system-upgrade-controller
  cordon: true
  drain:
    force: true
    ignoreDaemonSets: true
    deleteLocalData: true
  
  # Guardrail: Check cluster health before proceeding:
  prepare:
    image: rancher/rke2-upgrade:v1.35.7-rke2r1
    command: ["/bin/sh", "-c"]
    args:
      - |
        echo "Validating cluster node health..."
        if kubectl get nodes | grep -i "NotReady"; then
          echo "ERROR: Cluster contains NotReady nodes. Halting upgrade sequence."
          exit 1
        fi
        
        # Longhorn Guardrail
        if kubectl get crd volumes.longhorn.io >/dev/null 2>&1; then
          echo "Longhorn detected. Verifying volume robustness..."
          while true; do
            # Extract the robustness status of all volumes and count degraded/faulted instances
            DEGRADED_COUNT=$(kubectl get volumes.longhorn.io -n longhorn-system -o jsonpath='{range .items[*]}{.status.robustness}{"\n"}{end}' | grep -ciE 'degraded|faulted' || true)
            
            if [ "$DEGRADED_COUNT" -eq 0 ]; then
              echo "All Longhorn volumes are healthy. Proceeding."
              break
            fi
            
            echo "Waiting for $DEGRADED_COUNT Longhorn volume(s) to rebuild and sync..."
            sleep 15
          done
        fi
        
        echo "Cluster health verified. Proceeding with control plane upgrade."
        exit 0

  # Main upgrade execution container
  upgrade:
    image: registry.suse.com/bci/bci-base:latest
    command: ["chroot", "/host"]
    args: ["sh", "/run/system-upgrade/secrets/update/upgrade.sh"]
  
  # Mount the execution script
  secrets:
    - name: sles-os-upgrade-script
      path: /host/run/system-upgrade/secrets/update
  
  # The version string acts as an execution trigger. 
  # Update this string (e.g., sles-20260901) to trigger future OS updates.
  version: sles-20260828